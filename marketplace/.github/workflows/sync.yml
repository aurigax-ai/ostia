name: Sync Ostia extension releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Download the extension releases this repository does not hold yet
        id: unseen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets sources
          gh api repos/aurigax-ai/ostia/releases --paginate --jq '.[].tag_name' |
            node sync-releases.mjs unseen . > unseen.tsv
          : > failures.txt
          while IFS=$'\t' read -r tag id version; do
            if ! gh release download "$tag" -R aurigax-ai/ostia -p "$id-$version.tar.gz" -D assets; then
              echo "$tag: no archive to download" >> failures.txt
              continue
            fi
            rm -rf clone
            if ! git clone --quiet --depth 1 --branch "$tag" https://github.com/aurigax-ai/ostia clone ||
              ! cp -r "clone/src/extensions/$id" "sources/$id-$version"; then
              rm -f "assets/$id-$version.tar.gz"
              echo "$tag: no source to copy" >> failures.txt
            fi
            rm -rf clone
          done < unseen.tsv
          echo "count=$(find assets -name '*.tar.gz' | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Verify and place the releases
        if: steps.unseen.outputs.count != '0'
        run: |
          cp failures.txt downloads-failed.txt
          node sync-releases.mjs place . assets sources
          cat downloads-failed.txt >> failures.txt
          rm downloads-failed.txt
      - name: The source builds what was released
        if: steps.unseen.outputs.count != '0'
        run: |
          git add -A extensions versions src ostia-marketplace.json
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm validate
          git diff --exit-code -- extensions
      - name: Commit and push
        if: steps.unseen.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A extensions versions src ostia-marketplace.json
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Sync extension releases"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
      - name: Fail on the releases that could not be placed
        if: always()
        run: |
          cat failures.txt
          test ! -s failures.txt
