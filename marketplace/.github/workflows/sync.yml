name: Sync Ostia extension releases

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the extension releases this repository does not hold yet
        id: unseen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets sources
          gh api repos/aurigax-ai/ostia/releases --paginate \
            --jq '.[] | select(.tag_name | startswith("ext/")) | .tag_name' |
          while read -r tag; do
            id=${tag#ext/}
            id=${id%%/*}
            version=${tag##*/v}
            have=$(node -p "try { require('./extensions/$id/ostia.json').version } catch { '' }")
            if [ -d "versions/$id/$version" ] || [ "$have" = "$version" ]; then continue; fi
            gh release download "$tag" -R aurigax-ai/ostia -p "$id-$version.tar.gz" -D assets
            git clone --quiet --depth 1 --branch "$tag" https://github.com/aurigax-ai/ostia "sources/clone"
            cp -r "sources/clone/src/extensions/$id" "sources/$id-$version"
            rm -rf sources/clone
          done
          echo "count=$(find assets -name '*.tar.gz' | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: steps.unseen.outputs.count != '0'
      - uses: actions/setup-node@v7
        if: steps.unseen.outputs.count != '0'
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.unseen.outputs.count != '0'
      - name: Place the releases
        if: steps.unseen.outputs.count != '0'
        run: node sync-releases.mjs . assets sources
      - name: The source builds what was released
        if: steps.unseen.outputs.count != '0'
        run: |
          git add -A extensions versions src ostia-marketplace.json
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm validate
          git diff --exit-code -- extensions
      - name: Commit and push
        if: steps.unseen.outputs.count != '0'
        run: |
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Sync extension releases"
          git push
