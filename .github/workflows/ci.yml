name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    outputs:
      linux:
        description: runs-on value for Linux jobs (JSON)
        value: ${{ jobs.changes.outputs.linux }}
      macos:
        description: runs-on value for unit-macos (JSON)
        value: ${{ jobs.changes.outputs.macos }}
  workflow_dispatch:
    inputs:
      full:
        description: Run the e2e suites too
        type: boolean
        default: true
  # Nightly full run on main, so an e2e regression shows up within a day even
  # when no release candidate is cut. 18:00 UTC = 02:00 Asia/Taipei.
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=5120
  # Tests that read a sandboxed process's memory (process_vm_readv). The
  # self-hosted Linux node forbids that (kernel.yama.ptrace_scope=3), so they
  # run on GitHub-hosted Ubuntu instead: the whole unit job, and this e2e test.
  PTRACE_E2E: with Unix sockets off the shell still starts

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code }}
      # The e2e suites (Linux, macOS) are the slow part. They run for tags
      # (v1.2.3 and pre-releases such as v1.2.3-rc.1, via release.yml), the
      # nightly schedule and manual dispatch; pull requests and pushes to main
      # get static, unit, unit-macos and build only.
      full: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full) }}
      linux: ${{ steps.runner.outputs.linux }}
      macos: ${{ steps.runner.outputs.macos }}
    steps:
      # Routing only, not security: a PR can edit this step. The self-hosted
      # runners enforce the same rule in their job-started hook, which a PR
      # cannot touch (homelab-infra#137). Keep the two lists in sync.
      # 1400096531 is this repository's ID; it survives the rename to Ostiaterm.
      - id: runner
        env:
          TRUSTED: ${{ github.repository_id == '1400096531'
            && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.actor)
            && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.triggering_actor)
            && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.id == github.event.repository.id
                && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.event.pull_request.user.login))) }}
          # Repo variables to fall back to GitHub-hosted without a code change,
          # e.g. while the Mac mini is offline: set to "off".
          LINUX_SWITCH: ${{ vars.OSTIA_SELF_HOSTED_LINUX }}
          MACOS_SWITCH: ${{ vars.OSTIA_SELF_HOSTED_MACOS }}
        run: |
          linux='"ubuntu-24.04"'
          macos='"macos-26"'
          if [ "$TRUSTED" = true ]; then
            [ "$LINUX_SWITCH" = off ] || linux='"ostia-linux"'
            [ "$MACOS_SWITCH" = off ] || macos='["self-hosted","ostia-macos"]'
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y zsh bubblewrap socat ripgrep
          # Ubuntu (GitHub-hosted) only; the ARC node runs SELinux and has no such sysctl.
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Pine CI'
          git config --global user.email 'ci@pine.invalid'
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out
          retention-days: 3

  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zsh bubblewrap socat ripgrep
          # Ubuntu (GitHub-hosted) only; the ARC node runs SELinux and has no such sysctl.
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Pine CI'
          git config --global user.email 'ci@pine.invalid'
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        id: pty
        with:
          path: node_modules/node-pty/build
          key: node-pty-electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pty.outputs.cache-hit != 'true'
        run: pnpm rebuild
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - env:
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
        run: |
          args=(--shard=${{ matrix.shard }}/${{ strategy.job-total }})
          if [ "$SELF_HOSTED" = true ]; then args+=(--grep-invert "$PTRACE_E2E"); fi
          pnpm test:e2e "${args[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  e2e-ptrace:
    needs: [changes, build]
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.linux != '"ubuntu-24.04"'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y xvfb zsh bubblewrap socat ripgrep
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Pine CI'
          git config --global user.email 'ci@pine.invalid'
      - uses: ./.github/actions/setup
      - uses: actions/cache@v6
        id: pty
        with:
          path: node_modules/node-pty/build
          key: node-pty-electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pty.outputs.cache-hit != 'true'
        run: pnpm rebuild
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - run: pnpm test:e2e e2e/sandbox.spec.ts --grep "$PTRACE_E2E"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Not blob-*: e2e-report merges those, and a GitHub-hosted blob has a
          # different checkout path from the self-hosted shards, which
          # merge-reports refuses.
          name: ptrace-blob-report
          path: blob-report
          retention-days: 3

  unit-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v rg >/dev/null || brew install ripgrep
          zsh -fc 'autoload -U compaudit; compaudit' | xargs chmod go-w
          git config --global user.name 'Pine CI'
          git config --global user.email 'ci@pine.invalid'
      - uses: ./.github/actions/setup
      - run: pnpm rebuild
      - run: pnpm typecheck
      - run: pnpm test

  build-macos:
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm rebuild
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: out-macos
          path: out
          retention-days: 3

  e2e-macos:
    needs: build-macos
    runs-on: macos-26
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: keys
            specs: e2e/keybindings.spec.ts e2e/clipboard-surfaces.spec.ts e2e/clipboard-keys.spec.ts e2e/settings-gap.spec.ts e2e/tray.spec.ts
          - group: terminal
            specs: e2e/terminal-basics.spec.ts e2e/blocks.spec.ts e2e/input-editor.spec.ts
          - group: sandbox
            specs: e2e/sandbox.spec.ts
          - group: ssh
            specs: e2e/ssh.spec.ts e2e/ssh-remote-files.spec.ts
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v rg >/dev/null || brew install ripgrep
          zsh -fc 'autoload -U compaudit; compaudit' | xargs chmod go-w
          git config --global user.name 'Pine CI'
          git config --global user.email 'ci@pine.invalid'
      - uses: ./.github/actions/setup
      - run: pnpm rebuild
      - uses: actions/download-artifact@v8
        with:
          name: out-macos
          path: out
      - run: pnpm test:e2e ${{ matrix.specs }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-blob-${{ matrix.group }}
          path: blob-report
          retention-days: 3

  e2e-report:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: all-blob
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 14

  ci-result:
    needs: [changes, static, unit, build, e2e, e2e-ptrace]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          FULL: ${{ needs.changes.outputs.full }}
        run: |
          echo "$NEEDS" | jq -e --arg code "$CODE" --arg full "$FULL" '
            .changes.result == "success" and
            (."e2e-ptrace".result | IN("success", "skipped")) and
            .e2e.result == (if $full == "true" then "success" else "skipped" end) and
            (del(.changes, ."e2e-ptrace", .e2e) | to_entries
              | all(.value.result == (if $code == "true" then "success" else "skipped" end)))'
