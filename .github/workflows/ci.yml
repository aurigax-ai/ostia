name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    outputs:
      linux:
        description: runs-on value for Linux jobs (JSON)
        value: ${{ jobs.changes.outputs.linux }}
      macos:
        description: runs-on value for unit-macos (JSON)
        value: ${{ jobs.changes.outputs.macos }}
  workflow_dispatch:
    inputs:
      full:
        description: Run the e2e suites too
        type: boolean
        default: true
      platform:
        description: Which e2e platform to run (static, unit and build always run on Linux)
        type: choice
        options: [all, linux, macos]
        default: all
      specs:
        description: e2e files or patterns, space separated; empty runs everything. A non-empty value runs one Linux job and one macOS job instead of the shards and groups
        type: string
        default: ''
      repeat:
        description: Playwright --repeat-each for the e2e jobs
        type: string
        default: '1'
  # Nightly full run on main, so an e2e regression shows up within a day even
  # when no release candidate is cut. 18:00 UTC = 02:00 Asia/Taipei.
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=5120
  # Tests that read a sandboxed process's memory (process_vm_readv). The
  # self-hosted Linux node forbids that (kernel.yama.ptrace_scope=3), so they
  # run on GitHub-hosted Ubuntu instead: the whole unit job, and this e2e test.
  PTRACE_E2E: with Unix sockets off the shell still starts

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.event_name != 'push' && format('-{0}', github.event.pull_request.number || github.sha) || '' }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}-{2}-{3}', inputs.full, inputs.platform, inputs.specs, inputs.repeat) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      code: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code }}
      # The e2e suites (Linux, macOS) are the slow part. They run for tags
      # (v1.2.3 and pre-releases such as v1.2.3-rc.1, via release.yml), the
      # nightly schedule and manual dispatch. A pull request that changes the
      # e2e harness runs the full Linux suite (macOS stays on the nightly and
      # tags); one that changes other e2e files runs only the specs it changed
      # and the specs importing a changed file (changed). The merge queue runs
      # the full Linux suite when the group changes code, and skips e2e for a
      # docs-only group. Pull requests and the merge queue also get static,
      # unit, unit-dom and build; pushes to main run no e2e but also run
      # unit-macos, and a push the merge queue already passed runs only
      # unit-macos and quarantine (verified).
      full: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || (github.event_name == 'merge_group' && steps.filter.outputs.code == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full) || steps.e2e_paths.outputs.harness == 'true' }}
      changed: ${{ steps.e2e_paths.outputs.harness != 'true' && steps.e2e_paths.outputs.e2e == 'true' }}
      linux: ${{ steps.runner.outputs.linux }}
      linux_small: ${{ steps.runner.outputs.linux_small }}
      macos: ${{ steps.runner.outputs.macos }}
      platform: ${{ inputs.platform || (github.event_name == 'merge_group' && 'linux') || 'all' }}
      specs: ${{ steps.plan.outputs.specs }}
      repeat: ${{ steps.plan.outputs.repeat }}
      shards: ${{ steps.plan.outputs.shards }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      # Pull requests run only the unit tests their diff against the base can
      # affect (scripts/affectedTests.mjs); empty means every test, as in the
      # merge queue, on main, the nightly run, tags and manual dispatch. The
      # merge queue runs every test so that a main push can skip them.
      tests: ${{ steps.tests.outputs.plan }}
      # A push to main whose sha already passed ci-result in the merge queue
      # (scripts/mergeQueueVerified.mjs) skips static, unit, unit-dom and build.
      # Any other push, or a failed lookup, runs them as before.
      verified: ${{ steps.verified.outputs.verified == 'true' }}
    steps:
      # Routing only, not security: a PR can edit this step. The self-hosted
      # runners enforce the same rule in their job-started hook, which a PR
      # cannot touch (homelab-infra#137). Keep the two lists in sync.
      # 1400096531 is this repository's ID; it survives the rename to Ostiaterm.
      - id: runner
        env:
          TRUSTED: ${{ github.repository_id == '1400096531'
            && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.actor)
            && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.triggering_actor)
            && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.id == github.event.repository.id
                && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.event.pull_request.user.login))) }}
          # Repo variables to fall back to GitHub-hosted without a code change,
          # e.g. while the Mac mini is offline: set to "off".
          LINUX_SWITCH: ${{ vars.OSTIA_SELF_HOSTED_LINUX }}
          MACOS_SWITCH: ${{ vars.OSTIA_SELF_HOSTED_MACOS }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          linux='"ubuntu-24.04"'
          linux_small='"ubuntu-24.04"'
          macos='"macos-26"'
          if [ "$TRUSTED" = true ]; then
            if [ "$LINUX_SWITCH" != off ] && [ "$REF_TYPE" != tag ]; then
              linux='"ostia-linux"'
              linux_small='"ostia-linux-small"'
            fi
            [ "$MACOS_SWITCH" = off ] || macos='["self-hosted","ostia-macos"]'
          fi
          echo "linux=$linux" >> "$GITHUB_OUTPUT"
          echo "linux_small=$linux_small" >> "$GITHUB_OUTPUT"
          echo "macos=$macos" >> "$GITHUB_OUTPUT"
      # Only workflow_dispatch can fill these in; every other trigger gets the
      # full shard and group lists and a single repeat.
      - id: plan
        env:
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          repeat=${REPEAT:-1}
          if ! [[ $repeat =~ ^[1-9][0-9]*$ ]]; then
            echo "repeat must be a positive integer, got '$repeat'" >&2
            exit 1
          fi
          SPECS=$(printf '%s' "$SPECS" | tr '\r\n\t' '   ' | tr -s ' ')
          SPECS=${SPECS# }
          SPECS=${SPECS% }
          if [ -n "$SPECS" ]; then
            shards='[1]'
            macos_matrix=$(jq -cn --arg specs "$SPECS" '{include: [{group: "custom", specs: $specs}]}')
          else
            shards='[1,2,3,4]'
            macos_matrix=$(jq -cn '{include: [
              {group: "keys", specs: "e2e/keybindings.spec.ts e2e/clipboard-surfaces.spec.ts e2e/clipboard-keys.spec.ts e2e/settings-gap.spec.ts e2e/tray.spec.ts"},
              {group: "terminal", specs: "e2e/terminal-basics.spec.ts e2e/blocks.spec.ts e2e/input-editor.spec.ts"},
              {group: "sandbox", specs: "e2e/sandbox.spec.ts"},
              {group: "ssh", specs: "e2e/ssh.spec.ts e2e/ssh-remote-files.spec.ts"}
            ]}')
          fi
          {
            echo "specs=$SPECS"
            echo "repeat=$repeat"
            echo "shards=$shards"
            echo "macos_matrix=$macos_matrix"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '0' || '1' }}
      - if: github.event_name == 'pull_request'
        id: tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          plan=$(node scripts/affectedTests.mjs plan "$BASE_SHA") || plan=
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        id: e2e_paths
        with:
          predicate-quantifier: every
          filters: |
            e2e:
              - 'e2e/**'
              - '!**/*.md'
            harness:
              - '{e2e/helpers.ts,e2e/dataHome.ts,e2e/test.ts,playwright.config.ts,scripts/e2e.sh}'
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          verified=$(node scripts/mergeQueueVerified.mjs "$SHA" 2> "$RUNNER_TEMP/verified.log") || verified=false
          [ "$verified" = true ] || verified=false
          cat "$RUNNER_TEMP/verified.log"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          { echo "Merge queue verified: $verified"; cat "$RUNNER_TEMP/verified.log"; } >> "$GITHUB_STEP_SUMMARY"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
          electron: false
      - run: pnpm typecheck
      - run: pnpm lint

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: |
          scripts/retry.sh sudo apt-get update
          scripts/retry.sh sudo apt-get install -y zsh bubblewrap socat ripgrep tmux
          # Ubuntu (GitHub-hosted) only; the ARC node runs SELinux and has no such sysctl.
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: node scripts/affectedTests.mjs run node "$TESTS"
        timeout-minutes: 20
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
      - run: go test ./...
        working-directory: tsnet-helper

  unit-dom:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
          electron: false
      - run: node scripts/affectedTests.mjs run dom "$TESTS"
        timeout-minutes: 10
        env:
          TESTS: ${{ needs.changes.outputs.tests }}

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          electron: false
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out
          retention-days: 3

  e2e:
    needs: [changes, build]
    if: (needs.changes.outputs.full == 'true' || needs.changes.outputs.changed == 'true') && needs.changes.outputs.platform != 'macos'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 25 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.changed == 'true' && '[1]' || needs.changes.outputs.shards) }}
    steps:
      # Depth 2 gives the pull request's merge commit its base (HEAD^1) for --only-changed.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - run: |
          scripts/retry.sh sudo apt-get update
          scripts/retry.sh sudo apt-get install -y xvfb zsh bubblewrap socat ripgrep tmux
          # Ubuntu (GitHub-hosted) only; the ARC node runs SELinux and has no such sysctl.
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - uses: actions/cache@v6
        id: pty
        with:
          path: node_modules/node-pty/build
          key: node-pty-electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pty.outputs.cache-hit != 'true'
        run: pnpm rebuild
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 20 || 150 }}
        env:
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
          SPECS: ${{ needs.changes.outputs.specs }}
          REPEAT: ${{ needs.changes.outputs.repeat }}
          CHANGED: ${{ needs.changes.outputs.changed }}
        run: |
          read -ra specs <<< "$SPECS"
          args=("${specs[@]}" --shard=${{ matrix.shard }}/${{ strategy.job-total }} --repeat-each="$REPEAT")
          if [ "$SELF_HOSTED" = true ]; then args+=(--grep-invert "$PTRACE_E2E"); fi
          if [ "$CHANGED" = true ]; then args+=(--only-changed=HEAD^1); fi
          pnpm test:e2e "${args[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  e2e-ptrace:
    needs: [changes, build]
    if: >-
      needs.changes.outputs.full == 'true'
      && needs.changes.outputs.platform != 'macos'
      && needs.changes.outputs.linux != '"ubuntu-24.04"'
      && (needs.changes.outputs.specs == '' || contains(needs.changes.outputs.specs, 'sandbox'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 10 || 60 }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          scripts/retry.sh sudo apt-get update
          scripts/retry.sh sudo apt-get install -y xvfb zsh bubblewrap socat ripgrep tmux
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - uses: actions/cache@v6
        id: pty
        with:
          path: node_modules/node-pty/build
          key: node-pty-electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.pty.outputs.cache-hit != 'true'
        run: pnpm rebuild
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out
      - timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 5 || 45 }}
        env:
          REPEAT: ${{ needs.changes.outputs.repeat }}
        run: pnpm test:e2e e2e/sandbox.spec.ts --grep "$PTRACE_E2E" --repeat-each="$REPEAT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          # Not blob-*: e2e-report merges those, and a GitHub-hosted blob has a
          # different checkout path from the self-hosted shards, which
          # merge-reports refuses.
          name: ptrace-blob-report
          path: blob-report
          retention-days: 3

  unit-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.platform != 'linux' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos) }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v rg >/dev/null || brew install ripgrep
          command -v tmux >/dev/null || brew install tmux
          zsh -fc 'autoload -U compaudit; compaudit' | xargs chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: pnpm rebuild
      - run: pnpm typecheck
      - run: |
          node scripts/affectedTests.mjs run node "$TESTS"
          node scripts/affectedTests.mjs run dom "$TESTS"
        timeout-minutes: 35
        env:
          TESTS: ${{ needs.changes.outputs.tests }}

  build-macos:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.platform != 'linux' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: pnpm rebuild
      - run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: out-macos
          path: out
          retention-days: 3

  e2e-macos:
    needs: [changes, build-macos]
    runs-on: macos-26
    timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 20 || 120 }}
    continue-on-error: ${{ github.ref_type != 'tag' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          command -v rg >/dev/null || brew install ripgrep
          command -v tmux >/dev/null || brew install tmux
          zsh -fc 'autoload -U compaudit; compaudit' | xargs chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: pnpm rebuild
      - uses: actions/download-artifact@v8
        with:
          name: out-macos
          path: out
      - timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 10 || 90 }}
        env:
          SPECS: ${{ matrix.specs }}
          REPEAT: ${{ needs.changes.outputs.repeat }}
        run: |
          read -ra specs <<< "$SPECS"
          pnpm test:e2e "${specs[@]}" --repeat-each="$REPEAT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: macos-blob-${{ matrix.group }}
          path: blob-report
          retention-days: 3

  e2e-report:
    needs: [changes, e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_small) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - uses: actions/download-artifact@v8
        with:
          pattern: blob-*
          path: all-blob
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 14

  # Runs only the tests in test/quarantine.json, several times, and reports
  # pass/fail counts per entry. Never part of ci-result.
  quarantine:
    needs: [changes, build, build-macos]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && github.event_name != 'merge_group' && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && inputs.platform != 'linux' && '[{"runner":"ubuntu-24.04","out":"out"},{"runner":"macos-26","out":"out-macos"}]' || '[{"runner":"ubuntu-24.04","out":"out"}]') }}
    env:
      RUNS: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 10 || 5 }}
      E2E: ${{ needs.changes.outputs.full == 'true' && (needs.build.result == 'success' || needs.build-macos.result == 'success') }}
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        run: |
          scripts/retry.sh sudo apt-get update
          scripts/retry.sh sudo apt-get install -y xvfb zsh bubblewrap socat ripgrep tmux
          for k in apparmor_restrict_unprivileged_userns apparmor_restrict_unprivileged_unconfined; do
            [ ! -e /proc/sys/kernel/$k ] || sudo sysctl -w kernel.$k=0
          done
          zsh -fc 'autoload -U compaudit; compaudit' | xargs -r sudo chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - if: runner.os == 'macOS'
        run: |
          command -v rg >/dev/null || brew install ripgrep
          command -v tmux >/dev/null || brew install tmux
          zsh -fc 'autoload -U compaudit; compaudit' | xargs chmod go-w
          git config --global user.name 'Ostia CI'
          git config --global user.email 'ci@ostia.invalid'
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - if: runner.os == 'macOS'
        run: pnpm rebuild
      - run: node scripts/quarantine.mjs unit "$RUNS"
      - if: env.E2E == 'true' && runner.os == 'Linux'
        run: pnpm rebuild
      - if: env.E2E == 'true'
        id: out
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.out }}
          path: out
      - if: env.E2E == 'true' && steps.out.outcome == 'success'
        run: node scripts/quarantine.mjs e2e "$RUNS"

  # Pull requests and the merge queue only check the format of
  # test/quarantine.json (test/quarantine.test.ts). Pushes to main, the
  # nightly run, manual runs and tags (release.yml) fail here once an entry's date has
  # passed or its issue is closed. Not part of ci-result, so a PR is never
  # held up by a date it did not touch.
  quarantine-dates:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quarantine.mjs issues

  ci-result:
    needs: [changes, static, unit, unit-dom, build, e2e, e2e-ptrace, build-macos, e2e-macos]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_small) }}
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          FULL: ${{ needs.changes.outputs.full }}
          CHANGED: ${{ needs.changes.outputs.changed }}
          PLATFORM: ${{ needs.changes.outputs.platform }}
          GATE_MACOS: ${{ github.ref_type == 'tag' }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
        run: |
          echo "$NEEDS" | jq -e --arg code "$CODE" --arg full "$FULL" --arg changed "$CHANGED" --arg platform "$PLATFORM" --arg gate "$GATE_MACOS" '
            .changes.result == "success" and
            (."e2e-ptrace".result | IN("success", "skipped")) and
            .e2e.result == (if ($full == "true" or $changed == "true") and $platform != "macos" then "success" else "skipped" end) and
            (if $gate == "true" and $full == "true" and $platform != "linux"
              then (."build-macos".result == "success" and ."e2e-macos".result == "success")
              else true end) and
            (del(.changes, ."e2e-ptrace", .e2e, ."build-macos", ."e2e-macos") | to_entries
              | all(.value.result == (if $code == "true" and env.VERIFIED != "true" then "success" else "skipped" end)))'
