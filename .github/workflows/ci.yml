name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_call:
    outputs:
      linux:
        description: runs-on value for Linux jobs (JSON)
        value: ${{ jobs.changes.outputs.linux }}
      macos:
        description: runs-on value for unit-macos (JSON)
        value: ${{ jobs.changes.outputs.macos }}
  workflow_dispatch:
    inputs:
      full:
        description: Run the e2e suites too
        type: boolean
        default: true
      platform:
        description: Which e2e platform to run (static, unit and build always run on Linux)
        type: choice
        options: [all, linux, macos]
        default: all
      specs:
        description: e2e files or patterns, space separated; empty runs everything. A non-empty value runs one Linux job and one macOS job instead of the shards and groups
        type: string
        default: ''
      repeat:
        description: Playwright --repeat-each for the e2e jobs
        type: string
        default: '1'
      self_hosted:
        description: Run unit-dom and the Linux e2e shards on the self-hosted runners
        type: boolean
        default: false
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=5120
  PTRACE_E2E: with Unix sockets off the shell still starts

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}${{ github.event_name != 'push' && format('-{0}', github.event.pull_request.number || github.sha) || '' }}${{ github.event_name == 'workflow_dispatch' && format('-{0}-{1}-{2}-{3}-{4}', inputs.full, inputs.platform, inputs.specs, inputs.repeat, inputs.self_hosted) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
      actions: read
    outputs:
      code: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || steps.filter.outputs.code }}
      full: ${{ github.ref_type == 'tag' || github.event_name == 'schedule' || (github.event_name == 'merge_group' && steps.filter.outputs.code == 'true') || (github.event_name == 'workflow_dispatch' && inputs.full) || (steps.filter.outputs.code == 'true' && steps.tests.outputs.e2e_full == 'true') }}
      selected: ${{ steps.tests.outputs.e2e_full != 'true' && steps.tests.outputs.e2e_specs != '' }}
      linux: ${{ steps.runner.outputs.linux }}
      linux_small: ${{ steps.runner.outputs.linux_small }}
      linux_heavy: ${{ steps.runner.outputs.linux_heavy }}
      macos: ${{ steps.runner.outputs.macos }}
      platform: ${{ inputs.platform || (github.event_name == 'merge_group' && 'linux') || 'all' }}
      specs: ${{ steps.plan.outputs.specs || steps.tests.outputs.e2e_specs }}
      repeat: ${{ steps.plan.outputs.repeat }}
      shards: ${{ steps.tests.outputs.e2e_shards || steps.plan.outputs.shards }}
      changed_specs: ${{ steps.tests.outputs.changed_specs }}
      changed_shards: ${{ steps.tests.outputs.changed_shards || '[1]' }}
      changed_repeat: ${{ steps.tests.outputs.changed_repeat || '1' }}
      grep: ${{ steps.plan.outputs.grep }}
      grep_invert: ${{ steps.plan.outputs.grep_invert }}
      macos_matrix: ${{ steps.plan.outputs.macos_matrix }}
      tests: ${{ steps.tests.outputs.plan }}
      verified: ${{ steps.verified.outputs.verified == 'true' }}
    steps:
      - id: runner
        env:
          TRUSTED: ${{ github.repository_id == '1400096531'
            && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.actor)
            && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.triggering_actor)
            && (github.event_name == 'push' || github.event_name == 'workflow_dispatch'
              || (github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.id == github.event.repository.id
                && contains(fromJSON('["JustinHung0407","mtch3n"]'), github.event.pull_request.user.login))) }}
          LINUX_SWITCH: ${{ vars.OSTIA_SELF_HOSTED_LINUX }}
          MACOS_SWITCH: ${{ vars.OSTIA_SELF_HOSTED_MACOS }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT: ${{ github.event_name }}
          SELF_HOSTED: ${{ inputs.self_hosted }}
        run: |
          linux='"ubuntu-24.04"'
          linux_small='"ubuntu-24.04"'
          macos='"macos-26"'
          if [ "$TRUSTED" = true ]; then
            if [ "$LINUX_SWITCH" != off ] && [ "$REF_TYPE" != tag ]; then
              linux='"ostia-linux"'
              linux_small='"ostia-linux-small"'
            fi
            [ "$MACOS_SWITCH" = off ] || macos='["self-hosted","ostia-macos"]'
          fi
          linux_heavy=$linux
          if [ "$EVENT" = pull_request ] || { [ "$EVENT" = workflow_dispatch ] && [ "$SELF_HOSTED" != true ]; }; then
            linux_heavy='"ubuntu-24.04"'
          fi
          {
            echo "linux=$linux"
            echo "linux_small=$linux_small"
            echo "linux_heavy=$linux_heavy"
            echo "macos=$macos"
          } >> "$GITHUB_OUTPUT"
      - id: plan
        env:
          SPECS: ${{ inputs.specs }}
          REPEAT: ${{ inputs.repeat }}
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          repeat=${REPEAT:-1}
          if ! [[ $repeat =~ ^[1-9][0-9]*$ ]]; then
            echo "repeat must be a positive integer, got '$repeat'" >&2
            exit 1
          fi
          SPECS=$(printf '%s' "$SPECS" | tr '\r\n\t' '   ' | tr -s ' ')
          SPECS=${SPECS# }
          SPECS=${SPECS% }
          grep=
          grep_invert=
          if [ -n "$SPECS" ]; then
            shards='[1]'
            macos_matrix=$(jq -cn --arg specs "$SPECS" '{include: [{group: "custom", specs: $specs}]}')
          else
            shards='[1,2,3,4]'
            macos_matrix=$(jq -cn '{include: [
              {group: "keys", specs: "e2e/keybindings.spec.ts e2e/clipboard-surfaces.spec.ts e2e/modifier-remap.spec.ts e2e/settings-gap.spec.ts e2e/tray.spec.ts"},
              {group: "terminal", specs: "e2e/terminal-basics.spec.ts e2e/blocks.spec.ts e2e/input-editor.spec.ts"},
              {group: "sandbox", specs: "e2e/sandbox.spec.ts"},
              {group: "ssh", specs: "e2e/ssh.spec.ts e2e/ssh-remote-files.spec.ts"},
              {group: "windows", specs: "e2e/detached-windows.spec.ts e2e/workspace-restore.spec.ts"},
              {group: "updates", specs: "e2e/update-mac.spec.ts"}
            ]}')
            if [ "$EVENT" = merge_group ]; then
              shards='[1,2]'
              grep=@core
            elif [ "$REF_TYPE" = tag ]; then
              shards='[1,2,3,4,5,6]'
              grep_invert=@experimental
            elif [ "$EVENT" = schedule ]; then
              shards='[1,2,3,4,5,6]'
            fi
          fi
          {
            echo "specs=$SPECS"
            echo "repeat=$repeat"
            echo "shards=$shards"
            echo "grep=$grep"
            echo "grep_invert=$grep_invert"
            echo "macos_matrix=$macos_matrix"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && '0' || '1' }}
      - if: github.event_name == 'pull_request'
        id: tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$BASE_SHA
          if [ "$(git rev-parse -q --verify 'HEAD^2' || true)" = "$HEAD_SHA" ]; then
            base=$(git rev-parse 'HEAD^1')
          fi
          echo "plan base: $base"
          plan=$(node scripts/affectedTests.mjs plan "$base") || plan=
          echo "plan=$plan" >> "$GITHUB_OUTPUT"
          if [ -z "$plan" ] || [ "$(jq -c '.e2e' <<< "$plan")" = null ]; then
            echo "e2e_full=true" >> "$GITHUB_OUTPUT"
            echo "e2e: every Linux spec" >> "$GITHUB_STEP_SUMMARY"
          else
            count=$(jq '.e2e | length' <<< "$plan")
            {
              echo "e2e_specs=$(jq -r '.e2e | join(" ")' <<< "$plan")"
              echo "e2e_shards=$(jq -c '.e2eShards' <<< "$plan")"
            } >> "$GITHUB_OUTPUT"
            { echo "e2e: $count specs in $(jq '.e2eShards | length' <<< "$plan") job(s)"; jq -r '.e2e[] | "- " + .' <<< "$plan"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$plan" ] && [ "$(jq '.e2eChanged | length' <<< "$plan")" -gt 0 ]; then
            repeat=$(jq '.e2eChangedRepeat' <<< "$plan")
            {
              echo "changed_specs=$(jq -r '.e2eChanged | join(" ")' <<< "$plan")"
              echo "changed_shards=$(jq -c '.e2eChangedShards' <<< "$plan")"
              echo "changed_repeat=$repeat"
            } >> "$GITHUB_OUTPUT"
            { echo "e2e-changed: the specs this pull request changed, $repeat times each"; jq -r '.e2eChanged[] | "- " + .' <<< "$plan"; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'merge_group'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          verified=$(node scripts/mergeQueueVerified.mjs "$SHA" 2> "$RUNNER_TEMP/verified.log") || verified=false
          [ "$verified" = true ] || verified=false
          cat "$RUNNER_TEMP/verified.log"
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          { echo "Merge queue verified: $verified"; cat "$RUNNER_TEMP/verified.log"; } >> "$GITHUB_STEP_SUMMARY"

  static:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
          electron: false
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm quality

  hygiene:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          inputs: .github
          version: 1.30.1
          advanced-security: false
      - uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b

  dependency-review:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: node scripts/affectedTests.mjs run node "$TESTS"
        timeout-minutes: 20
        env:
          TESTS: ${{ needs.changes.outputs.tests }}
      - run: go test ./...
        working-directory: tsnet-helper

  unit-dom:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_heavy) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
          electron: false
      - run: node scripts/affectedTests.mjs run dom "$TESTS"
        timeout-minutes: 10
        env:
          TESTS: ${{ needs.changes.outputs.tests }}

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.verified != 'true'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          electron: false
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: out
          path: out
          retention-days: 3

  e2e:
    needs: [changes, build]
    if: (needs.changes.outputs.full == 'true' || needs.changes.outputs.selected == 'true') && needs.changes.outputs.platform != 'macos'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_heavy) }}
    timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 25 || 180 }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - uses: ./.github/actions/node-pty
      - uses: ./.github/actions/playwright-browsers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: out
          path: out
      - timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 20 || 150 }}
        env:
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
          SPECS: ${{ needs.changes.outputs.specs }}
          REPEAT: ${{ needs.changes.outputs.repeat }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          GREP: ${{ needs.changes.outputs.grep }}
          GREP_INVERT: ${{ needs.changes.outputs.grep_invert }}
        run: |
          read -ra specs <<< "$SPECS"
          args=("${specs[@]}" --shard="$SHARD" --repeat-each="$REPEAT")
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); fi
          invert=$GREP_INVERT
          if [ "$SELF_HOSTED" = true ]; then invert=${invert:+$invert|}$PTRACE_E2E; fi
          if [ -n "$invert" ]; then args+=(--grep-invert "$invert"); fi
          pnpm test:e2e "${args[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: blob-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  e2e-changed:
    needs: [changes, build]
    if: needs.changes.outputs.changed_specs != '' && needs.changes.outputs.platform != 'macos'
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_heavy) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.changed_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - uses: ./.github/actions/node-pty
      - uses: ./.github/actions/playwright-browsers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: out
          path: out
      - timeout-minutes: 50
        env:
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
          SPECS: ${{ needs.changes.outputs.changed_specs }}
          REPEAT: ${{ needs.changes.outputs.changed_repeat }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-changed-${{ matrix.shard }}.zip
        run: |
          read -ra specs <<< "$SPECS"
          args=("${specs[@]}" --shard="$SHARD" --repeat-each="$REPEAT")
          if [ "$SELF_HOSTED" = true ]; then args+=(--grep-invert "$PTRACE_E2E"); fi
          pnpm test:e2e "${args[@]}"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: blob-changed-${{ matrix.shard }}
          path: blob-report
          retention-days: 3

  e2e-ptrace:
    needs: [changes, build]
    if: >-
      (needs.changes.outputs.full == 'true' || needs.changes.outputs.selected == 'true')
      && needs.changes.outputs.platform != 'macos'
      && needs.changes.outputs.linux_heavy != '"ubuntu-24.04"'
      && (needs.changes.outputs.specs == '' || contains(needs.changes.outputs.specs, 'sandbox'))
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 10 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - uses: ./.github/actions/node-pty
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: out
          path: out
      - timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 5 || 45 }}
        env:
          REPEAT: ${{ needs.changes.outputs.repeat }}
        run: pnpm test:e2e e2e/sandbox.spec.ts --grep "$PTRACE_E2E" --repeat-each="$REPEAT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ptrace-blob-report
          path: blob-report
          retention-days: 3

  e2e-race:
    needs: [changes, build]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - uses: ./.github/actions/node-pty
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: out
          path: out
      - timeout-minutes: 30
        run: pnpm test:e2e --grep @race --repeat-each=10
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: race-blob-report
          path: blob-report
          retention-days: 3

  unit-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.platform != 'linux' && github.event_name != 'pull_request' && github.event_name != 'merge_group'
    runs-on: ${{ fromJSON(needs.changes.outputs.macos) }}
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: pnpm rebuild
      - run: pnpm typecheck
      - run: |
          node scripts/affectedTests.mjs run node "$TESTS"
          node scripts/affectedTests.mjs run dom "$TESTS"
        timeout-minutes: 35
        env:
          TESTS: ${{ needs.changes.outputs.tests }}

  build-macos:
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.platform != 'linux' && github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 20
    continue-on-error: ${{ github.ref_type != 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - run: pnpm rebuild
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: out-macos
          path: out
          retention-days: 3

  e2e-macos:
    needs: [changes, build-macos]
    runs-on: macos-26
    timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 20 || 120 }}
    continue-on-error: ${{ github.ref_type != 'tag' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.macos_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - run: pnpm rebuild
      - uses: ./.github/actions/playwright-browsers
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: out-macos
          path: out
      - timeout-minutes: ${{ needs.changes.outputs.repeat == '1' && 10 || 90 }}
        env:
          SPECS: ${{ matrix.specs }}
          REPEAT: ${{ needs.changes.outputs.repeat }}
        run: |
          read -ra specs <<< "$SPECS"
          pnpm test:e2e "${specs[@]}" --repeat-each="$REPEAT"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-blob-${{ matrix.group }}
          path: blob-report
          retention-days: 3

  e2e-macos-core:
    needs: [changes, build-macos]
    if: github.event_name == 'schedule' || github.ref_type == 'tag'
    runs-on: macos-26
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - run: pnpm rebuild
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: out-macos
          path: out
      - timeout-minutes: 15
        run: pnpm test:e2e --grep @core
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-core-blob-report
          path: blob-report
          retention-days: 3

  e2e-report:
    needs: [changes, e2e, e2e-changed]
    if: ${{ !cancelled() && (needs.e2e.result != 'skipped' || needs.e2e-changed.result != 'skipped') }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_small) }}
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        timeout-minutes: 10
        with:
          go: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: blob-*
          path: all-blob
          merge-multiple: true
      - run: pnpm exec playwright merge-reports --reporter html ./all-blob
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: e2e-report
          path: playwright-report
          retention-days: 14

  quarantine:
    needs: [changes, build, build-macos]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && github.event_name != 'merge_group' && github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && inputs.platform != 'linux' && '[{"runner":"ubuntu-24.04","out":"out"},{"runner":"macos-26","out":"out-macos"}]' || '[{"runner":"ubuntu-24.04","out":"out"}]') }}
    env:
      RUNS: ${{ contains(fromJSON('["schedule","workflow_dispatch"]'), github.event_name) && 10 || 5 }}
      E2E: ${{ needs.changes.outputs.full == 'true' && (needs.build.result == 'success' || needs.build-macos.result == 'success') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - if: runner.os == 'macOS'
        uses: ./.github/actions/macos-deps
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - if: runner.os == 'macOS'
        run: pnpm rebuild
      - run: node scripts/quarantine.mjs unit "$RUNS"
      - if: env.E2E == 'true' && runner.os == 'Linux'
        run: pnpm rebuild
      - if: env.E2E == 'true'
        id: out
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ matrix.out }}
          path: out
      - if: env.E2E == 'true' && steps.out.outcome == 'success'
        run: node scripts/quarantine.mjs e2e "$RUNS"
      - if: ${{ !cancelled() && env.E2E == 'true' && steps.out.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quarantine-crash-dumps-${{ runner.os }}
          path: test-results/**/crash-dumps-*/**/*.dmp
          if-no-files-found: ignore
          retention-days: 14

  quarantine-dates:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/quarantine.mjs issues

  ci-result:
    needs: [changes, static, hygiene, dependency-review, unit, unit-dom, build, e2e, e2e-changed, e2e-ptrace, build-macos, e2e-macos]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON(needs.changes.outputs.linux_small) }}
    timeout-minutes: 5
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          FULL: ${{ needs.changes.outputs.full }}
          SELECTED: ${{ needs.changes.outputs.selected }}
          PLATFORM: ${{ needs.changes.outputs.platform }}
          GATE_MACOS: ${{ github.ref_type == 'tag' }}
          CHANGED: ${{ needs.changes.outputs.changed_specs != '' && needs.changes.outputs.platform != 'macos' }}
          VERIFIED: ${{ needs.changes.outputs.verified }}
        run: |
          echo "$NEEDS" | jq -e --arg code "$CODE" --arg full "$FULL" --arg selected "$SELECTED" --arg platform "$PLATFORM" --arg gate "$GATE_MACOS" --arg changed "$CHANGED" '
            .changes.result == "success" and
            (."e2e-ptrace".result | IN("success", "skipped")) and
            (."dependency-review".result | IN("success", "skipped")) and
            .e2e.result == (if ($full == "true" or $selected == "true") and $platform != "macos" then "success" else "skipped" end) and
            ."e2e-changed".result == (if $changed == "true" then "success" else "skipped" end) and
            (if $gate == "true" and $full == "true" and $platform != "linux"
              then (."build-macos".result == "success" and ."e2e-macos".result == "success")
              else true end) and
            (del(.changes, ."e2e-ptrace", ."dependency-review", .e2e, ."e2e-changed", ."build-macos", ."e2e-macos") | to_entries
              | all(.value.result == (if $code == "true" and env.VERIFIED != "true" then "success" else "skipped" end)))'
