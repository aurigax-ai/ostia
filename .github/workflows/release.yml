name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=5120

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ${{ fromJSON(needs.ci.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: pnpm exec electron-builder --linux AppImage dir deb --publish never
      - name: Archive the unpacked app
        run: |
          name="ostia-${GITHUB_REF_NAME#v}-linux-x64"
          mv dist/linux-unpacked "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  package-macos:
    needs: ci
    runs-on: macos-26
    environment: release-macos
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12_B64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/ostia-signing.keychain-db"
          kcpw=$(openssl rand -base64 24)
          printf '%s' "$P12_B64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Write the App Store Connect API key for notarytool
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        env:
          CSC_NAME: YEONG FENG HUNG (4ZNCN9338G)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never
      - name: Gatekeeper accepts the notarized app
        run: |
          spctl -a -vvv -t exec dist/mac-arm64/Ostia.app
          xcrun stapler validate dist/mac-arm64/Ostia.app
      - name: Remove the temporary keychain and API key
        if: always()
        run: |
          [ -n "${CSC_KEYCHAIN:-}" ] && security delete-keychain "$CSC_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*.dmg
          if-no-files-found: error

  sdk:
    needs: package
    # Stays GitHub-hosted: npm trusted publishing (OIDC) does not support
    # self-hosted runners (docs.npmjs.com/trusted-publishers).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm build:sdk
      - name: Publish the extension SDK to npm
        working-directory: out/sdk
        run: npm publish --tag ${{ contains(github.ref_name, '-') && 'next' || 'latest' }}

  publish:
    needs: [ci, package, package-macos]
    runs-on: ${{ fromJSON(needs.ci.outputs.linux) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Notes from the commits since the previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s (%h)' ${prev:+$prev..}"$GITHUB_REF_NAME" \
            | grep -v 'chore(release)' > notes.md || true
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: packages-macos
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.dmg
          prerelease: ${{ contains(github.ref_name, '-') }}

  apt:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
