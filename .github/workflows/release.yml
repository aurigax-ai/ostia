name: Release

on:
  push:
    tags: ['v*', '!v*-main.*']

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=5120

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
      actions: read
    uses: ./.github/workflows/ci.yml

  package:
    needs: ci
    runs-on: ${{ fromJSON(needs.ci.outputs.linux) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm build
        env:
          OSTIA_TELEMETRY_KEY: ${{ vars.OSTIA_TELEMETRY_KEY }}
          OSTIA_TELEMETRY_HOST: ${{ vars.OSTIA_TELEMETRY_HOST }}
          OSTIA_EXTENSION_PUBLIC_KEY: ${{ vars.OSTIA_EXTENSION_PUBLIC_KEY }}
      - name: Build version is the plain tag version
        run: test "v$(node -p 'require("./out/build-info.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm exec electron-builder --linux dir deb --publish never
      - name: Archive the unpacked app
        run: |
          name="ostia-${GITHUB_REF_NAME#v}-linux-x64"
          mv dist/linux-unpacked "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error

  package-macos:
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup
        timeout-minutes: 10
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm build
        env:
          OSTIA_TELEMETRY_KEY: ${{ vars.OSTIA_TELEMETRY_KEY }}
          OSTIA_TELEMETRY_HOST: ${{ vars.OSTIA_TELEMETRY_HOST }}
          OSTIA_EXTENSION_PUBLIC_KEY: ${{ vars.OSTIA_EXTENSION_PUBLIC_KEY }}
      - name: Build version is the plain tag version
        run: test "v$(node -p 'require("./out/build-info.json").version')" = "$GITHUB_REF_NAME"
      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12_B64: ${{ secrets.CSC_LINK }}
          P12_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/ostia-signing.keychain-db"
          kcpw=$(openssl rand -base64 24)
          printf '%s' "$P12_B64" | base64 -D > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"
          echo "CSC_KEYCHAIN=$kc" >> "$GITHUB_ENV"
      - name: Write the App Store Connect API key for notarytool
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Sign, notarize and staple
        env:
          CSC_NAME: YEONG FENG HUNG (4ZNCN9338G)
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --mac dmg --arm64 --publish never
      - name: Gatekeeper accepts the notarized app
        run: |
          spctl -a -vvv -t exec dist/mac-arm64/Ostia.app
          xcrun stapler validate dist/mac-arm64/Ostia.app
      - name: Remove the temporary keychain and API key
        if: always()
        run: |
          [ -n "${CSC_KEYCHAIN:-}" ] && security delete-keychain "$CSC_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [ci, package, package-macos]
    runs-on: ${{ fromJSON(needs.ci.outputs.linux) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Notes from the commits since the previous release
        run: node scripts/releaseNotes.mjs "$GITHUB_REF_NAME" > notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: packages-macos
          path: dist
      - name: Checksums of every release asset
        working-directory: dist
        run: |
          cp ../packaging/linux/install.sh install.sh
          sha256sum -- *.tar.gz *.deb *.dmg install.sh > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ contains(github.ref_name, '-') }}
        run: |
          shopt -s nullglob
          packages=(dist/*.tar.gz dist/*.deb dist/*.dmg)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "no packages in dist" >&2
            exit 1
          fi
          files=("${packages[@]}" dist/install.sh dist/SHA256SUMS)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md --prerelease="$PRERELEASE" --draft=false
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --prerelease="$PRERELEASE"
          fi

  apt:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-apt.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
