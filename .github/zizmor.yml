rules:
  self-repository:
    disable: true
  artipacked:
    ignore:
      - release.yml
      - main-build.yml
      - publish-apt.yml
      - publish-homebrew.yml
  cache-poisoning:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  secrets-inherit:
    ignore:
      - release.yml
  github-app:
    ignore:
      - publish-apt.yml
      - publish-homebrew.yml
