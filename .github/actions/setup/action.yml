name: Setup
description: pnpm, Node, Go, the Electron download cache, and the project's dependencies
inputs:
  go:
    description: Install Go (the tsnet helper's toolchain)
    default: 'true'
  electron:
    description: Download the Electron binary (pnpm install runs the install scripts)
    default: 'true'
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        version=$(node -p "require('./package.json').packageManager.split('@')[1]")
        scripts/retry.sh npm install --prefix "$HOME/setup-pnpm" --no-audit --no-fund "pnpm@$version"
        echo "$HOME/setup-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
    - if: inputs.go == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: tsnet-helper/go.mod
        cache-dependency-path: tsnet-helper/go.sum
    - if: inputs.electron == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.electron != 'true' && '--ignore-scripts' || '' }}
      run: |
        node_prefix=$(dirname "$(dirname "$(command -v node)")")
        if [ -f "$node_prefix/include/node/node.h" ]; then
          export npm_config_nodedir="$node_prefix"
        fi
        scripts/retry.sh pnpm install --frozen-lockfile $IGNORE_SCRIPTS
    - if: inputs.electron == 'true' && runner.environment != 'github-hosted'
      shell: bash
      run: |
        [ -w /opt/ci-cache ] || exit 0
        cache=/opt/ci-cache/electron-gyp
        version=$(node -p "require('electron/package.json').version")
        if ! scripts/electron-headers.sh restore "$cache" "$version"; then
          scripts/retry.sh node node_modules/.pnpm/node_modules/node-gyp/bin/node-gyp.js install \
            "--target=$version" --dist-url=https://www.electronjs.org/headers "--devdir=$HOME/.electron-gyp"
          scripts/electron-headers.sh publish "$cache" "$version"
        fi
