name: Setup
description: pnpm, Node, Go, the Electron download cache, and the project's dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
    - uses: actions/setup-go@v7
      with:
        go-version-file: tsnet-helper/go.mod
        cache-dependency-path: tsnet-helper/go.sum
    - if: runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      run: pnpm install --frozen-lockfile
