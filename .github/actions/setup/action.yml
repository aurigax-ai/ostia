name: Setup
description: pnpm, Node, Go, the Electron download cache, and the project's dependencies
inputs:
  go:
    description: Install Go (the tsnet helper's toolchain)
    default: 'true'
  electron:
    description: Download the Electron binary (pnpm install runs the install scripts)
    default: 'true'
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: ${{ runner.environment == 'github-hosted' && 'pnpm' || '' }}
    - if: inputs.go == 'true'
      uses: actions/setup-go@v7
      with:
        go-version-file: tsnet-helper/go.mod
        cache-dependency-path: tsnet-helper/go.sum
    - if: inputs.electron == 'true' && runner.environment == 'github-hosted'
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
        key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
    - shell: bash
      env:
        IGNORE_SCRIPTS: ${{ inputs.electron != 'true' && '--ignore-scripts' || '' }}
      run: scripts/retry.sh pnpm install --frozen-lockfile $IGNORE_SCRIPTS
