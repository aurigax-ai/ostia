name: Playwright browsers
description: Playwright's own Chromium and Firefox, which the portable-file specs open from file://
runs:
  using: composite
  steps:
    - id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/ms-playwright' || '~/.cache/ms-playwright' }}
        key: playwright-browsers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
    - if: runner.os == 'Linux' && runner.environment == 'github-hosted'
      shell: bash
      env:
        RETRY_ATTEMPTS: 2
        RETRY_TIMEOUT: 240
      run: |
        start=$SECONDS
        if ! scripts/retry.sh pnpm exec playwright install-deps chromium firefox; then
          echo "::error::playwright install-deps did not finish: the apt mirror is slow or down. The browser cache is unrelated."
          exit 1
        fi
        echo "playwright-browsers: system packages ready in $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
    - shell: bash
      env:
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        RETRY_ATTEMPTS: 2
        RETRY_TIMEOUT: 300
      run: |
        start=$SECONDS
        if ! scripts/retry.sh pnpm exec playwright install chromium firefox; then
          echo "::error::playwright install did not finish (browser cache hit: ${CACHE_HIT:-false}): the browser download is slow or blocked."
          exit 1
        fi
        echo "playwright-browsers: cache hit ${CACHE_HIT:-false}, install took $((SECONDS - start))s" | tee -a "$GITHUB_STEP_SUMMARY"
