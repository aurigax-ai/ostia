<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: var(--surface-1);
        color: var(--fg);
        font-family: var(--font-ui);
      }
      #root {
        flex: 1 1 auto;
        min-height: 0;
      }
      .message {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 16px;
        color: var(--fg-muted);
        font-size: var(--text-ui-sm);
        line-height: var(--text-ui-sm--line-height);
        text-align: center;
      }
      .tabs {
        display: flex;
        flex: none;
        gap: 2px;
        overflow-x: auto;
        padding: 2px 6px;
        border-top: 1px solid var(--line);
        background: var(--surface-2);
      }
      .tabs button {
        padding: 2px 10px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--fg-muted);
        font: inherit;
        font-size: var(--text-ui-sm);
        line-height: var(--text-ui-sm--line-height);
        white-space: nowrap;
        cursor: pointer;
      }
      .tabs button[aria-selected='true'] {
        border-bottom-color: var(--fg);
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="sheet.js"></script>
  </body>
</html>
