<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="base.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: var(--bg-sunken);
        color: var(--fg);
        font-family: var(--font-ui);
      }
      .stage {
        display: flex;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 16px;
        overflow: auto;
        outline: none;
      }
      .stage[data-pan="ready"] {
        cursor: grab;
      }
      .stage[data-pan="active"] {
        cursor: grabbing;
      }
      .canvas {
        position: relative;
        flex: none;
        margin: auto;
        cursor: default;
        user-select: none;
      }
      .stage[data-pan] .canvas {
        cursor: inherit;
      }
      .canvas[data-grid="on"] {
        background: repeating-conic-gradient(var(--surface-2) 0% 25%, var(--surface-3) 0% 50%) 0 0 /
          16px 16px;
      }
      .canvas img {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      .region {
        position: absolute;
        border: 1px solid var(--brand);
        background: var(--brand-glow);
        pointer-events: none;
      }
      .status {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 4px 10px;
        border: 1px solid var(--line-strong);
        border-radius: var(--radius-md);
        background: var(--surface-2);
        color: var(--fg-muted);
        font-size: var(--text-ui-sm);
        line-height: var(--text-ui-sm--line-height);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="image.js"></script>
  </body>
</html>
