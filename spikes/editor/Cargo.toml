[package]
name = "spike-editor"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
gpui-kit = { version = "=0.8.1", features = [
  "tree-sitter",
  "tree-sitter-typescript",
  "tree-sitter-rust",
  "tree-sitter-python",
  "tree-sitter-bash",
] }
lsp-types = { version = "0.97", features = ["proposed"] }
serde_json = "1"
similar = "2.7"

