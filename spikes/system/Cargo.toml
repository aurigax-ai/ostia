[package]
name = "ostia-spike-system"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
aes = "0.8"
anyhow = "1"
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
global-hotkey = "0.8"
keyring = "4.2"
keyring-core = "1"
notify-rust = "4.18"
pbkdf2 = "0.12"
rfd = "0.16"
sha1 = "0.10"
serde_json = "1"
thiserror = "2"
tray-icon = "0.24"
zbus = { version = "5", features = ["blocking-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
rand = "0.9"
