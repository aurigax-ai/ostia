name: Sync with Ostia

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.pine.outputs.tag }}
      stale: ${{ steps.pine.outputs.stale }}
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the latest Ostia release
        id: pine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/aurigax-ai/ostia/releases/latest --jq .tag_name)
          have=$(node -p 'require("./package.json").version')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "v$have" != "$tag" ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; fi

  sync:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          path: marketplace
      - uses: actions/checkout@v7
        with:
          repository: aurigax-ai/ostia
          ref: ${{ needs.check.outputs.tag }}
          path: pine
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: pine/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
        working-directory: pine
      - run: pnpm publish:marketplace ../marketplace
        working-directory: pine
      - run: pnpm typecheck && pnpm test && pnpm validate
        working-directory: marketplace
      - name: Commit and push
        working-directory: marketplace
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Ostia ${TAG#v}"
          git push
