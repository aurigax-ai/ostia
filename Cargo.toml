[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
ostia-agents = { path = "crates/agents" }
ostia-sandbox = { path = "crates/sandbox" }
ostia-panes = { path = "crates/panes" }
ostia-terminal = { path = "crates/terminal" }
ostia-workspaces = { path = "crates/workspaces" }
ostia-app = { path = "crates/app", default-features = false }
ostia-ui = { path = "crates/ui" }
ostia-approvals = { path = "crates/approvals" }
ostia-attention = { path = "crates/attention" }
ostia-base = { path = "crates/base" }
ostia-contract = { path = "crates/contract" }
ostia-diagnostics = { path = "crates/diagnostics" }
ostia-fd = { path = "crates/fd" }
ostia-files = { path = "crates/files" }
ostia-control = { path = "crates/control" }
ostia-model = { path = "crates/model" }
ostia-park = { path = "crates/park" }
ostia-privacy = { path = "crates/privacy" }
ostia-rpc = { path = "crates/rpc" }
ostia-testkit = { path = "crates/testkit" }
ostia-testscript = { path = "crates/testscript" }

aes-gcm = "0.10"
anyhow = "1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
command-fds = "0.3"
fixed_decimal = "0.7"
flate2 = "1"
futures = "0.3"
futures-util = "0.3"
gpui-kit = { version = "=0.8.1", default-features = false, features = ["component"] }
gethostname = "1"
getrandom = "0.4"
globset = "0.4"
hex = "0.4"
indexmap = { version = "2", features = ["serde"] }
hmac = "0.13"
icu_calendar = "2"
icu_collator = "2"
icu_datetime = "2"
icu_experimental = "0.7"
icu_locale_core = "2"
libc = "0.2"
libghostty-vt = { version = "0.2.2", default-features = false }
parking_lot = "0.12"
nix = { version = "0.31", default-features = false, features = ["net"] }
notify = "8"
percent-encoding = "2"
portable-pty = "0.9.0"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
regex = "1"
regress = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.9", default-features = false, features = ["client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
rustix = { version = "1", features = ["fs", "process", "system", "termios"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
subtle = "2"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1.53", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.28"
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
writeable = "0.6"
x509-parser = "0.18"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
