directories:
  output: dist
files:
  - out/**
  - "!out/extensions/**"
  - package.json
  - resources/icon.png
extraResources:
  - from: out/extensions
    to: extensions
asarUnpack:
  - out/cli/**
npmRebuild: true
linux:
  target: dir
  icon: resources/icons
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
