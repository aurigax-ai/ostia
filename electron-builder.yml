appId: ai.aurigax.pine
productName: Pine
directories:
  output: dist
files:
  - out/**
  - "!out/extensions/**"
  - "!out/marketplace/**"
  - package.json
  - resources/icon.png
extraResources:
  - from: out/extensions
    to: extensions
  - from: out/build-info.json
    to: build-info.json
asarUnpack:
  - out/cli/**
  - out/sandbox/**
  - out/redaction/**
  - node_modules/@anthropic-ai/sandbox-runtime/**
npmRebuild: true
linux:
  target: dir
  icon: resources/icons
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
  icon: resources/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
win:
  target: nsis
