appId: ai.aurigax.ostia
productName: Ostia
directories:
  output: dist
files:
  - out/**
  - "!out/extensions/**"
  - "!out/marketplace/**"
  - "!out/artifact-runtime/**"
  - "!node_modules/esbuild/bin/**"
  - package.json
  - resources/icon.png
extraResources:
  - from: out/extensions
    to: extensions
  - from: out/build-info.json
    to: build-info.json
  - from: out/artifact-runtime
    to: artifact-runtime
asarUnpack:
  - out/cli/**
  - out/sandbox/**
  - out/redaction/**
  - out/tsnet/**
  - node_modules/@anthropic-ai/sandbox-runtime/**
  - node_modules/@vscode/ripgrep-*/**
  - node_modules/@esbuild/**
npmRebuild: true
linux:
  target: dir
  executableName: ostia
  artifactName: ostia-${version}.${ext}
  icon: resources/icons
  category: Development
  maintainer: AurigaX <aurigax.ai@gmail.com>
  synopsis: Terminal workspace for coding agents
  extraResources:
    - from: packaging/bin/ostia
      to: bin/ostia
    - from: packaging/linux/user-install.sh
      to: user-install.sh
    - from: packaging/linux/ai.aurigax.ostia.manage-script-tokens.policy
      to: polkit/ai.aurigax.ostia.manage-script-tokens.policy
    - from: resources/icons
      to: icons
    - from: resources/icon.svg
      to: icon.svg
deb:
  packageName: ostia
  artifactName: ostia_${version}_${arch}.${ext}
  afterInstall: packaging/apt/after-install.tpl
  afterRemove: packaging/apt/after-remove.tpl
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
  recommends:
    - bubblewrap
    - socat
    - ripgrep
    - git
    - iproute2
mac:
  target: dmg
  artifactName: ostia-${version}-${arch}.${ext}
  category: public.app-category.developer-tools
  icon: resources/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  extraResources:
    - from: packaging/bin/ostia
      to: bin/ostia
win:
  target: nsis
