directories:
  output: dist
files:
  - out/**
  - "!out/extensions/**"
  - package.json
  - resources/icon.png
extraResources:
  - from: out/extensions
    to: extensions
  - from: out/build-info.json
    to: build-info.json
asarUnpack:
  - out/cli/**
  - out/sandbox/**
  - node_modules/@anthropic-ai/sandbox-runtime/**
npmRebuild: true
linux:
  target: dir
  icon: resources/icons
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
